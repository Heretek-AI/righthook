name: min2caller
on: workflow_dispatch
permissions:
  contents: read
jobs:
  c:
    uses: ./.github/workflows/min2.yml
    with:
      languages: 'x'
      coverage-threshold: 80
      diff-coverage: 80
      coverage-gate-script: .righthook/coverage_gate.py
      node-version: "22"
      python-version: "3.13"
      go-version: "1.24"
      java-version: "21"
      ruby-version: "3.4"
