# Generated by righthook v0.1.0. Do not edit.
# Re-run `npx righthook sync` after changing languages or thresholds.
name: righthook
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.13"
  GO_VERSION: "1.24"
  JAVA_VERSION: "21"
  RUBY_VERSION: "3.4"
concurrency:
  group: righthook-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint-typescript:
    name: lint (typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: |
          npm audit --audit-level=high
          npm test
          tsc --noEmit
          git ls-files -z -- '*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc,css}' ':(exclude).righthook/**' ':(exclude).github/workflows/righthook.yml' ':(exclude).github/dependabot.yml' ':(exclude)lefthook.yml' ':(exclude).editorconfig' ':(exclude).yamllint.yaml' ':(exclude)commitlint.config.mjs' | xargs -0 -r biome ci --error-on-warnings
  security:
    name: security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read # needed to check out the repository
      security-events: write # needed by upload-sarif to publish findings
      actions: read # required by upload-sarif on private repositories
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          VERSION=$(curl -fsSL https://api.github.com/repos/betterleaks/betterleaks/releases/latest | jq -r .tag_name)
          curl -fsSL "https://github.com/betterleaks/betterleaks/releases/download/${VERSION}/betterleaks_${VERSION#v}_linux_x64.tar.gz" -o /tmp/betterleaks.tar.gz
          sudo tar -xzf /tmp/betterleaks.tar.gz -C /usr/local/bin betterleaks
          betterleaks git . --redact --report-format sarif --report-path leaks.sarif || true
      - run: |
          curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy fs --format sarif --output trivy.sarif --scanners vuln,misconfig,secret . || true
      - if: always() && hashFiles('leaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          sarif_file: leaks.sarif
          category: betterleaks
      - if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          sarif_file: trivy.sarif
          category: trivy
  workflow-lint:
    name: workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          "$(go env GOPATH)/bin/actionlint"
      - run: pipx run zizmor --pedantic --min-severity=low .github/workflows
  deps-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
  required:
    name: required
    if: always()
    runs-on: ubuntu-latest
    needs: [lint-typescript, security, workflow-lint, deps-review]
    steps:
      - name: Every required job succeeded
        run: |
          for result in $JOB_RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "a required job reported $result"; exit 1 ;;
            esac
          done
          echo "all required jobs succeeded"
        env:
          JOB_RESULTS: ${{ join(needs.*.result, ' ') }}
