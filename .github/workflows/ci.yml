      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-php
          path: .righthook-coverage/php
          if-no-files-found: warn
  test-java:
    name: test (java)
    if: contains(fromJSON(inputs.languages), 'java')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - run: mvn -B -q verify -Pjacoco
      - if: always()
        run: |
          mkdir -p .righthook-coverage/java
          find . -name 'jacoco.xml' -not -path './.righthook-coverage/java/*' -print0 | xargs -0 -r -I{} cp {} .righthook-coverage/java/
          ls -la .righthook-coverage/java || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-java
          path: .righthook-coverage/java
          if-no-files-found: warn
  test-kotlin:
    name: test (kotlin)
    if: (contains(fromJSON(inputs.languages), 'kotlin') || contains(fromJSON(inputs.languages), 'java'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - run: ./gradlew test jacocoTestReport
      - if: always()
        run: |
          mkdir -p .righthook-coverage/kotlin
          find . -name 'jacocoTestReport.xml' -not -path './.righthook-coverage/kotlin/*' -print0 | xargs -0 -r -I{} cp {} .righthook-coverage/kotlin/
          ls -la .righthook-coverage/kotlin || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-kotlin
          path: .righthook-coverage/kotlin
          if-no-files-found: warn
  test-dotnet:
    name: test (dotnet)
    if: contains(fromJSON(inputs.languages), 'dotnet')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      - run: dotnet restore
      - run: dotnet test --collect:"XPlat Code Coverage"
      - if: always()
        run: |
          mkdir -p .righthook-coverage/dotnet
          find . -name 'coverage.cobertura.xml' -not -path './.righthook-coverage/dotnet/*' -print0 | xargs -0 -r -I{} cp {} .righthook-coverage/dotnet/
          ls -la .righthook-coverage/dotnet || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-dotnet
          path: .righthook-coverage/dotnet
          if-no-files-found: warn
  test-swift:
    name: test (swift)
    if: contains(fromJSON(inputs.languages), 'swift')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
      - run: swift package resolve
      - run: swift test --enable-code-coverage
      - run: |
          mkdir -p coverage
          xcrun llvm-cov export -format=lcov .build/debug/*.xctest/Contents/MacOS/* -instr-profile .build/debug/codecov/default.profdata > coverage/lcov.info
      - if: always()
        run: |
          mkdir -p .righthook-coverage/swift
          find . -name 'lcov.info' -not -path './.righthook-coverage/swift/*' -print0 | xargs -0 -r -I{} cp {} .righthook-coverage/swift/
          ls -la .righthook-coverage/swift || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-swift
          path: .righthook-coverage/swift
          if-no-files-found: warn
  test-dart:
    name: test (dart)
    if: contains(fromJSON(inputs.languages), 'dart')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
      - run: dart pub get || flutter pub get
      - run: |
          rm -rf coverage
          flutter test --coverage
      - if: always()
        run: |
          mkdir -p .righthook-coverage/dart
          find . -name 'lcov.info' -not -path './.righthook-coverage/dart/*' -print0 | xargs -0 -r -I{} cp {} .righthook-coverage/dart/
          ls -la .righthook-coverage/dart || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-dart
          path: .righthook-coverage/dart
          if-no-files-found: warn
  test-cpp:
    name: test (cpp)
    if: contains(fromJSON(inputs.languages), 'cpp')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck gcovr clang-format
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS=--coverage && cmake --build build && ctest --test-dir build --output-on-failure
      - run: |
          mkdir -p coverage
          gcovr --cobertura coverage/cobertura.xml --exclude tests/
      - if: always()
        run: |
          mkdir -p .righthook-coverage/cpp
          find . -name 'cobertura.xml' -not -path './.righthook-coverage/cpp/*' -print0 | xargs -0 -r -I{} cp {} .righthook-coverage/cpp/
          ls -la .righthook-coverage/cpp || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-cpp
          path: .righthook-coverage/cpp
          if-no-files-found: warn
  security:
    name: security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read # needed to check out the repository
      security-events: write # needed by upload-sarif to publish findings
      actions: read # required by upload-sarif on private repositories
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: |
          curl -fsSL https://raw.githubusercontent.com/betterleaks/betterleaks/main/scripts/install.sh | sh
          ./bin/betterleaks git . --redact --report-format sarif --report-path leaks.sarif || true
      - run: |
          curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy fs --format sarif --output trivy.sarif --scanners vuln,misconfig,secret . || true
      - if: always()
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          sarif_file: leaks.sarif
          category: betterleaks
      - if: always()
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          sarif_file: trivy.sarif
          category: trivy
  workflow-lint:
    name: workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          "$(go env GOPATH)/bin/actionlint"
      - run: pipx run zizmor --pedantic --min-severity=low .github/workflows
  coverage-gate:
    name: coverage gate
    if: always()
    runs-on: ubuntu-latest
    needs: [test-typescript, test-python, test-go, test-rust, test-ruby, test-php, test-java, test-kotlin, test-dotnet, test-swift, test-dart, test-cpp]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-*
          path: coverage
      - run: |
          ls -la coverage || true
          if [ ! -f "$GATE_SCRIPT" ]; then
            GATE_SCRIPT=node_modules/righthook/.righthook/coverage_gate.py
          fi
          python3 "$GATE_SCRIPT" --threshold "$COVERAGE_THRESHOLD" --report typescript=coverage/coverage-typescript/lcov.info --report python=coverage/coverage-python/cobertura.xml --report go=coverage/coverage-go/cobertura.xml --report rust=coverage/coverage-rust/lcov.info --report ruby=coverage/coverage-ruby/cobertura.xml --report php=coverage/coverage-php/cobertura.xml --report java=coverage/coverage-java/jacoco.xml --report kotlin=coverage/coverage-kotlin/jacocoTestReport.xml --report dotnet=coverage/coverage-dotnet/coverage.cobertura.xml --report swift=coverage/coverage-swift/lcov.info --report dart=coverage/coverage-dart/lcov.info --report cpp=coverage/coverage-cpp/cobertura.xml
        env:
          COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
          GATE_SCRIPT: ${{ inputs.coverage-gate-script }}
      - if: github.event_name == 'pull_request'
        run: |
          if ! command -v pipx >/dev/null; then
            echo "pipx unavailable; skipping diff coverage"
            exit 0
          fi
          pipx run diff-cover "coverage/coverage-typescript/lcov.info" --compare-branch="origin/$BASE_REF" --fail-under="$DIFF_COVERAGE"
          pipx run diff-cover "coverage/coverage-python/cobertura.xml" --compare-branch="origin/$BASE_REF" --fail-under="$DIFF_COVERAGE"
          pipx run diff-cover "coverage/coverage-go/cobertura.xml" --compare-branch="origin/$BASE_REF" --fail-under="$DIFF_COVERAGE"
          pipx run diff-cover "coverage/coverage-rust/lcov.info" --compare-branch="origin/$BASE_REF" --fail-under="$DIFF_COVERAGE"
          pipx run diff-cover "coverage/coverage-ruby/cobertura.xml" --compare-branch="origin/$BASE_REF" --fail-under="$DIFF_COVERAGE"
          pipx run diff-cover "coverage/coverage-php/cobertura.xml" --compare-branch="origin/$BASE_REF" --fail-under="$DIFF_COVERAGE"
          pipx run diff-cover "coverage/coverage-java/jacoco.xml" --compare-branch="origin/$BASE_REF" --fail-under="$DIFF_COVERAGE"
          pipx run diff-cover "coverage/coverage-kotlin/jacocoTestReport.xml" --compare-branch="origin/$BASE_REF" --fail-under="$DIFF_COVERAGE"
          pipx run diff-cover "coverage/coverage-dotnet/coverage.cobertura.xml" --compare-branch="origin/$BASE_REF" --fail-under="$DIFF_COVERAGE"
          pipx run diff-cover "coverage/coverage-swift/lcov.info" --compare-branch="origin/$BASE_REF" --fail-under="$DIFF_COVERAGE"
          pipx run diff-cover "coverage/coverage-dart/lcov.info" --compare-branch="origin/$BASE_REF" --fail-under="$DIFF_COVERAGE"
          pipx run diff-cover "coverage/coverage-cpp/cobertura.xml" --compare-branch="origin/$BASE_REF" --fail-under="$DIFF_COVERAGE"
        env:
          BASE_REF: ${{ github.base_ref }}
          DIFF_COVERAGE: ${{ inputs.diff-coverage }}
  required:
    name: required
    if: always()
    runs-on: ubuntu-latest
    needs: [lint-typescript, lint-python, lint-go, lint-rust, lint-ruby, lint-php, lint-java, lint-kotlin, lint-dotnet, lint-swift, lint-dart, lint-cpp, lint-terraform, test-typescript, test-python, test-go, test-rust, test-ruby, test-php, test-java, test-kotlin, test-dotnet, test-swift, test-dart, test-cpp, security, workflow-lint, coverage-gate]
    steps:
      - name: Every required job succeeded
        run: |
          for result in $JOB_RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "a required job reported $result"; exit 1 ;;
            esac
          done
          echo "all required jobs succeeded"
        env:
          JOB_RESULTS: ${{ join(needs.*.result, ' ') }}
