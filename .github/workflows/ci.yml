      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ inputs.python-version }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python-version }}
      - run: pip install -e ".[dev]" || pip install -e . || pip install -r requirements.txt || true
      - run: pytest -q --cov --cov-report=xml:coverage/cobertura.xml --cov-report=term
      - if: always()
        run: |
          mkdir -p .righthook-coverage/python
          find . -name 'cobertura.xml' -not -path './.righthook-coverage/python/*' -print0 | xargs -0 -r -I{} cp {} .righthook-coverage/python/
          ls -la .righthook-coverage/python || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-python
          path: .righthook-coverage/python
          if-no-files-found: warn
  test-go:
    name: test (go)
    if: contains(fromJSON(inputs.languages), 'go')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ inputs.go-version }}
      - uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6
        with:
          version: latest
      - run: go mod download
      - run: mkdir -p coverage && go test -race ./... -coverprofile=coverage/cover.out -covermode=atomic
      - run: |
          go run github.com/axw/gocov/gocov@latest convert coverage/cover.out > coverage/cover.json
          go run github.com/AlekSi/gocov-xml@latest < coverage/cover.json > coverage/cobertura.xml
      - if: always()
        run: |
          mkdir -p .righthook-coverage/go
          find . -name 'cobertura.xml' -not -path './.righthook-coverage/go/*' -print0 | xargs -0 -r -I{} cp {} .righthook-coverage/go/
          ls -la .righthook-coverage/go || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-go
          path: .righthook-coverage/go
          if-no-files-found: warn
  test-rust:
    name: test (rust)
    if: contains(fromJSON(inputs.languages), 'rust')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - run: cargo fetch
      - run: |
          mkdir -p coverage
          cargo llvm-cov --lcov --output-path coverage/lcov.info --all-features
      - if: always()
        run: |
          mkdir -p .righthook-coverage/rust
          find . -name 'lcov.info' -not -path './.righthook-coverage/rust/*' -print0 | xargs -0 -r -I{} cp {} .righthook-coverage/rust/
          ls -la .righthook-coverage/rust || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-rust
          path: .righthook-coverage/rust
          if-no-files-found: warn
  test-ruby:
    name: test (ruby)
    if: contains(fromJSON(inputs.languages), 'ruby')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: ${{ inputs.ruby-version }}
          bundler-cache: false
      - run: bundle install --jobs 4 --retry 3
      - run: echo "RUBYOPT=-r./.righthook/simplecov.rb" >> "$GITHUB_ENV"
      - run: |
          mkdir -p coverage
          bundle exec rspec
      - if: always()
        run: |
          mkdir -p .righthook-coverage/ruby
          find . -name 'cobertura.xml' -not -path './.righthook-coverage/ruby/*' -print0 | xargs -0 -r -I{} cp {} .righthook-coverage/ruby/
          ls -la .righthook-coverage/ruby || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-ruby
          path: .righthook-coverage/ruby
          if-no-files-found: warn
  test-php:
    name: test (php)
    if: contains(fromJSON(inputs.languages), 'php')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: composer install --no-interaction --prefer-dist
      - run: |
          mkdir -p coverage
          phpunit --coverage-clover coverage/cobertura.xml
      - if: always()
        run: |
          mkdir -p .righthook-coverage/php
          find . -name 'cobertura.xml' -not -path './.righthook-coverage/php/*' -print0 | xargs -0 -r -I{} cp {} .righthook-coverage/php/
