# Generated by righthook v0.1.0. Do not edit.
#
# Reusable pipeline. Consumers call it as:
#   uses: <owner>/righthook/.github/workflows/ci.yml@<sha>
# and declare the language ids their repository uses, as reported by
# `npx righthook doctor --json`.
name: righthook
on:
  workflow_call:
    inputs:
      languages:
        description: JSON array of language ids, as reported by `npx righthook doctor --json`.
        required: true
        type: string
      coverage-threshold:
        description: Minimum total line coverage percentage.
        required: false
        default: 80
        type: number
      diff-coverage:
        description: Minimum changed-line coverage percentage on pull requests.
        required: false
        default: 80
        type: number
      coverage-gate-script:
        description: Path to coverage_gate.py, relative to the repository root.
        required: false
        default: .righthook/coverage_gate.py
        type: string
      node-version:
        required: false
        default: "22"
        type: string
      python-version:
        required: false
        default: "3.13"
        type: string
      go-version:
        required: false
        default: "1.24"
        type: string
      java-version:
        required: false
        default: "21"
        type: string
      ruby-version:
        required: false
        default: "3.4"
        type: string
    secrets:
      CODECOV_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  lint-typescript:
    name: lint (typescript)
    if: contains(fromJSON(inputs.languages), 'typescript')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
      - run: npm ci
      - run: |
          bun audit
          npm audit --audit-level=high
          pnpm audit --audit-level high
          yarn npm audit --severity high
          jest --coverage
          node --test
          npm test
          vitest run --coverage
          knip --no-progress
          tsc --noEmit
          git ls-files -z -- '*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc,css}' ':(exclude).righthook/**' ':(exclude).github/workflows/righthook.yml' ':(exclude).github/dependabot.yml' ':(exclude)lefthook.yml' ':(exclude).editorconfig' ':(exclude).yamllint.yaml' ':(exclude)commitlint.config.mjs' | xargs -0 -r biome ci --error-on-warnings
  lint-python:
    name: lint (python)
    if: contains(fromJSON(inputs.languages), 'python')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ inputs.python-version }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python-version }}
      - run: pip install -e ".[dev]" || pip install -e . || pip install -r requirements.txt || true
      - run: |
          git ls-files -z -- '*.py' ':(exclude).righthook/**' ':(exclude).github/workflows/righthook.yml' ':(exclude).github/dependabot.yml' ':(exclude)lefthook.yml' ':(exclude).editorconfig' ':(exclude).yamllint.yaml' ':(exclude)commitlint.config.mjs' | xargs -0 -r ruff format --check
          git ls-files -z -- '*.py' ':(exclude).righthook/**' ':(exclude).github/workflows/righthook.yml' ':(exclude).github/dependabot.yml' ':(exclude)lefthook.yml' ':(exclude).editorconfig' ':(exclude).yamllint.yaml' ':(exclude)commitlint.config.mjs' | xargs -0 -r ruff check --force-exclude
          pip-audit --strict --progress-spinner off
          bandit -q -r . -x ./tests,./test,./.venv
          pytest -q --cov --cov-report=xml:coverage/cobertura.xml --cov-report=term
          git ls-files -z -- '*.py' ':(exclude).righthook/**' ':(exclude).github/workflows/righthook.yml' ':(exclude).github/dependabot.yml' ':(exclude)lefthook.yml' ':(exclude).editorconfig' ':(exclude).yamllint.yaml' ':(exclude)commitlint.config.mjs' | xargs -0 -r vulture --min-confidence 80
          git ls-files -z -- '*.py' ':(exclude).righthook/**' ':(exclude).github/workflows/righthook.yml' ':(exclude).github/dependabot.yml' ':(exclude)lefthook.yml' ':(exclude).editorconfig' ':(exclude).yamllint.yaml' ':(exclude)commitlint.config.mjs' | xargs -0 -r mypy --install-types --non-interactive
  lint-go:
    name: lint (go)
    if: contains(fromJSON(inputs.languages), 'go')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ inputs.go-version }}
      - uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6
        with:
          version: latest
      - run: go mod download
      - run: |
          test -z "$(goimports -l .)"
          golangci-lint run --timeout 10m
          govulncheck ./...
          mkdir -p coverage && go test -race ./... -coverprofile=coverage/cover.out -covermode=atomic
  lint-rust:
    name: lint (rust)
    if: contains(fromJSON(inputs.languages), 'rust')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - run: cargo fetch
      - run: |
          cargo fmt --all --check
          cargo audit --deny warnings
          cargo machete
          cargo clippy --all-targets --all-features -- -D warnings
  lint-ruby:
    name: lint (ruby)
    if: contains(fromJSON(inputs.languages), 'ruby')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: ${{ inputs.ruby-version }}
          bundler-cache: false
      - run: bundle install --jobs 4 --retry 3
      - run: |
          rubocop --force-exclusion
          bundler-audit check --update
          brakeman -q --no-pager
          bundle exec rake test
          bundle exec rspec
  lint-php:
    name: lint (php)
    if: contains(fromJSON(inputs.languages), 'php')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: composer install --no-interaction --prefer-dist
      - run: |
          php-cs-fixer fix --config=.php-cs-fixer.dist.php --dry-run --diff
          phpcs --standard=phpcs.xml.dist
          composer audit --no-dev --locked
          phpunit --coverage-clover coverage/cobertura.xml
          phpstan analyse --no-progress --memory-limit=1G
  lint-java:
    name: lint (java)
    if: contains(fromJSON(inputs.languages), 'java')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - run: |
          mvn -q -DskipTests spotless:check
          mvn -q -DskipTests checkstyle:check
          mvn -B -q test
          mvn -q -DskipTests pmd:check
          mvn -q -DskipTests spotbugs:check
  lint-kotlin:
    name: lint (kotlin)
    if: (contains(fromJSON(inputs.languages), 'kotlin') || contains(fromJSON(inputs.languages), 'java'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - run: |
          ktlint
          detekt --build-upon-default-config
          ./gradlew test
  lint-dotnet:
    name: lint (dotnet)
    if: contains(fromJSON(inputs.languages), 'dotnet')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      - run: dotnet restore
      - run: |
          dotnet format whitespace --verify-no-changes
          dotnet format analyzers --verify-no-changes
          dotnet test --collect:"XPlat Code Coverage"
          dotnet build --no-restore -warnaserror
  lint-swift:
    name: lint (swift)
    if: contains(fromJSON(inputs.languages), 'swift')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
      - run: swift package resolve
      - run: |
          swiftformat --lint .
          swift test --enable-code-coverage
          swiftlint --strict --quiet
  lint-dart:
    name: lint (dart)
    if: contains(fromJSON(inputs.languages), 'dart')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
      - run: dart pub get || flutter pub get
      - run: |
          git ls-files -z -- '*.dart' ':(exclude).righthook/**' ':(exclude).github/workflows/righthook.yml' ':(exclude).github/dependabot.yml' ':(exclude)lefthook.yml' ':(exclude).editorconfig' ':(exclude).yamllint.yaml' ':(exclude)commitlint.config.mjs' | xargs -0 -r dart format --output=none --set-exit-if-changed
          dart analyze --fatal-infos --fatal-warnings
          flutter test --coverage
  lint-cpp:
    name: lint (cpp)
    if: contains(fromJSON(inputs.languages), 'cpp')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck gcovr clang-format
      - run: |
          git ls-files "*.c" "*.cc" "*.cpp" "*.h" "*.hpp" | xargs -r clang-format --dry-run --Werror
          cppcheck --enable=warning,style,performance,portability --inline-suppr --error-exitcode=1 --suppress=missingIncludeSystem .
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS=--coverage && cmake --build build && ctest --test-dir build --output-on-failure
  lint-terraform:
    name: lint (terraform)
    if: contains(fromJSON(inputs.languages), 'terraform')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          TERRAFORM_VERSION=1.9.8
          curl -fsSL "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" -o /tmp/terraform.zip
          sudo unzip -o /tmp/terraform.zip -d /usr/local/bin
      - run: |
          git ls-files -z -- '*.{tf,tfvars,hcl}' ':(exclude).righthook/**' ':(exclude).github/workflows/righthook.yml' ':(exclude).github/dependabot.yml' ':(exclude)lefthook.yml' ':(exclude).editorconfig' ':(exclude).yamllint.yaml' ':(exclude)commitlint.config.mjs' | xargs -0 -r terraform fmt -check
          tflint --recursive
          terraform validate
  test-typescript:
    name: test (typescript)
    if: contains(fromJSON(inputs.languages), 'typescript')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
      - run: npm ci
      - run: jest --coverage
      - if: always()
        run: |
          mkdir -p .righthook-coverage/typescript
          find . -name 'lcov.info' -not -path './.righthook-coverage/typescript/*' -print0 | xargs -0 -r -I{} cp {} .righthook-coverage/typescript/
          ls -la .righthook-coverage/typescript || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-typescript
          path: .righthook-coverage/typescript
          if-no-files-found: warn
  test-python:
    name: test (python)
    if: contains(fromJSON(inputs.languages), 'python')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ inputs.python-version }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python-version }}
      - run: pip install -e ".[dev]" || pip install -e . || pip install -r requirements.txt || true
      - run: pytest -q --cov --cov-report=xml:coverage/cobertura.xml --cov-report=term
      - if: always()
        run: |
          mkdir -p .righthook-coverage/python
          find . -name 'cobertura.xml' -not -path './.righthook-coverage/python/*' -print0 | xargs -0 -r -I{} cp {} .righthook-coverage/python/
          ls -la .righthook-coverage/python || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-python
          path: .righthook-coverage/python
          if-no-files-found: warn
  test-go:
    name: test (go)
    if: contains(fromJSON(inputs.languages), 'go')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ inputs.go-version }}
      - uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6
        with:
          version: latest
      - run: go mod download
      - run: mkdir -p coverage && go test -race ./... -coverprofile=coverage/cover.out -covermode=atomic
      - run: |
          go run github.com/axw/gocov/gocov@latest convert coverage/cover.out > coverage/cover.json
          go run github.com/AlekSi/gocov-xml@latest < coverage/cover.json > coverage/cobertura.xml
      - if: always()
        run: |
          mkdir -p .righthook-coverage/go
          find . -name 'cobertura.xml' -not -path './.righthook-coverage/go/*' -print0 | xargs -0 -r -I{} cp {} .righthook-coverage/go/
          ls -la .righthook-coverage/go || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-go
          path: .righthook-coverage/go
          if-no-files-found: warn
  test-rust:
    name: test (rust)
    if: contains(fromJSON(inputs.languages), 'rust')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - run: cargo fetch
      - run: |
          mkdir -p coverage
          cargo llvm-cov --lcov --output-path coverage/lcov.info --all-features
      - if: always()
        run: |
          mkdir -p .righthook-coverage/rust
          find . -name 'lcov.info' -not -path './.righthook-coverage/rust/*' -print0 | xargs -0 -r -I{} cp {} .righthook-coverage/rust/
          ls -la .righthook-coverage/rust || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-rust
          path: .righthook-coverage/rust
          if-no-files-found: warn
  test-ruby:
    name: test (ruby)
    if: contains(fromJSON(inputs.languages), 'ruby')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: ${{ inputs.ruby-version }}
          bundler-cache: false
      - run: bundle install --jobs 4 --retry 3
      - run: echo "RUBYOPT=-r./.righthook/simplecov.rb" >> "$GITHUB_ENV"
      - run: |
          mkdir -p coverage
          bundle exec rspec
      - if: always()
        run: |
          mkdir -p .righthook-coverage/ruby
          find . -name 'cobertura.xml' -not -path './.righthook-coverage/ruby/*' -print0 | xargs -0 -r -I{} cp {} .righthook-coverage/ruby/
          ls -la .righthook-coverage/ruby || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-ruby
          path: .righthook-coverage/ruby
          if-no-files-found: warn
  test-php:
    name: test (php)
    if: contains(fromJSON(inputs.languages), 'php')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: composer install --no-interaction --prefer-dist
      - run: |
          mkdir -p coverage
          phpunit --coverage-clover coverage/cobertura.xml
      - if: always()
        run: |
          mkdir -p .righthook-coverage/php
          find . -name 'cobertura.xml' -not -path './.righthook-coverage/php/*' -print0 | xargs -0 -r -I{} cp {} .righthook-coverage/php/
          ls -la .righthook-coverage/php || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-php
          path: .righthook-coverage/php
          if-no-files-found: warn
  test-java:
    name: test (java)
    if: contains(fromJSON(inputs.languages), 'java')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - run: mvn -B -q verify -Pjacoco
      - if: always()
        run: |
          mkdir -p .righthook-coverage/java
          find . -name 'jacoco.xml' -not -path './.righthook-coverage/java/*' -print0 | xargs -0 -r -I{} cp {} .righthook-coverage/java/
          ls -la .righthook-coverage/java || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-java
          path: .righthook-coverage/java
          if-no-files-found: warn
