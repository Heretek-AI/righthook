pre-push:
  parallel: false
  commands:
    osv-scanner:
      priority: 1
      run: "sh node_modules/@heretek-ai/righthook/.righthook/run.sh osv-scanner scan source --recursive --config .righthook/osv-scanner.toml ."
    pip-audit:
      priority: 1
      run: "sh node_modules/@heretek-ai/righthook/.righthook/run.sh pip-audit --strict --progress-spinner off"
    bandit:
      priority: 2
      run: "sh node_modules/@heretek-ai/righthook/.righthook/run.sh bandit -q -r . -x ./tests,./test,./.venv"
    jscpd:
      priority: 2
      run: "sh node_modules/@heretek-ai/righthook/.righthook/run.sh jscpd --config .righthook/jscpd.json --threshold 5 ."
    pytest:
      priority: 2
      run: "sh node_modules/@heretek-ai/righthook/.righthook/run.sh pytest -q --cov --cov-report=xml:coverage/cobertura.xml --cov-report=term"
    betterleaks-deep:
      priority: 3
      run: "sh node_modules/@heretek-ai/righthook/.righthook/run.sh betterleaks git . --redact --verbose"
    vulture:
      priority: 3
      run: "sh node_modules/@heretek-ai/righthook/.righthook/run.sh vulture --min-confidence 80 ."
    typos:
      priority: 4
      run: "sh node_modules/@heretek-ai/righthook/.righthook/run.sh typos --force-exclude ."
    actionlint:
      priority: 5
      run: "sh node_modules/@heretek-ai/righthook/.righthook/run.sh actionlint"
    mypy:
      priority: 5
      run: "sh node_modules/@heretek-ai/righthook/.righthook/run.sh mypy --install-types --non-interactive ."
    zizmor:
      priority: 6
      run: "sh node_modules/@heretek-ai/righthook/.righthook/run.sh zizmor --pedantic --min-severity=low .github/workflows"
    trivy-config:
      priority: 7
      run: "sh node_modules/@heretek-ai/righthook/.righthook/run.sh trivy config --exit-code 1 --severity HIGH,CRITICAL --skip-dirs .git ."

commit-msg:
  parallel: false
  commands:
    commitlint:
      priority: 1
      run: "sh node_modules/@heretek-ai/righthook/.righthook/run.sh commitlint --edit {1}"
