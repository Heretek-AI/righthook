# Generated by righthook v0.1.0. Do not edit.
# Local overrides belong in lefthook-local.yml (highest precedence).
min_version: 1.10.0
assert_lefthook_installed: true
skip_lfs: false
colors: true
# lefthook's default glob engine; pinned so matching stays stable.
glob_matcher: gobwas

pre-commit:
  parallel: false
  commands:
    biome-format:
      priority: 1
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc,css}"
      exclude:
        - .righthook/**
        - .github/workflows/righthook.yml
        - .github/dependabot.yml
        - lefthook.yml
        - .editorconfig
        - .yamllint.yaml
        - commitlint.config.mjs
      stage_fixed: true
      run: "sh .righthook/run.sh biome format --write --no-errors-on-unmatched {staged_files}"
    merge-conflicts:
      priority: 1
      exclude:
        - .righthook/**
        - .github/workflows/righthook.yml
        - .github/dependabot.yml
        - lefthook.yml
        - .editorconfig
        - .yamllint.yaml
        - commitlint.config.mjs
      run: "sh .righthook/run.sh sh .righthook/merge-conflicts.sh {staged_files}"
    prettier-other:
      priority: 1
      glob: "*.{md,mdx,yml,yaml,json,jsonc,css,scss,html}"
      exclude:
        - .righthook/**
        - .github/workflows/righthook.yml
        - .github/dependabot.yml
        - lefthook.yml
        - .editorconfig
        - .yamllint.yaml
        - commitlint.config.mjs
      stage_fixed: true
      run: "sh .righthook/run.sh prettier --write --ignore-unknown {staged_files}"
    shfmt:
      priority: 1
      glob: "*.{sh,bash}"
      exclude:
        - .righthook/**
        - .github/workflows/righthook.yml
        - .github/dependabot.yml
        - lefthook.yml
        - .editorconfig
        - .yamllint.yaml
        - commitlint.config.mjs
      stage_fixed: true
      run: "sh .righthook/run.sh shfmt -w -i 2 -ci {staged_files}"
    biome-lint:
      priority: 2
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc,css}"
      exclude:
        - .righthook/**
        - .github/workflows/righthook.yml
        - .github/dependabot.yml
        - lefthook.yml
        - .editorconfig
        - .yamllint.yaml
        - commitlint.config.mjs
      run: "sh .righthook/run.sh biome lint --write --no-errors-on-unmatched --error-on-warnings {staged_files}"
    typos-fix:
      priority: 2
      exclude:
        - .righthook/**
        - .github/workflows/righthook.yml
        - .github/dependabot.yml
        - lefthook.yml
        - .editorconfig
        - .yamllint.yaml
        - commitlint.config.mjs
      stage_fixed: true
      run: "sh .righthook/run.sh typos --write-changes --force-exclude {staged_files}"
    betterleaks:
      priority: 3
      run: "sh .righthook/run.sh betterleaks git --pre-commit --staged --redact --verbose"
    editorconfig:
      priority: 4
      exclude:
        - .righthook/**
        - .github/workflows/righthook.yml
        - .github/dependabot.yml
        - lefthook.yml
        - .editorconfig
        - .yamllint.yaml
        - commitlint.config.mjs
      run: "sh .righthook/run.sh editorconfig-checker {staged_files}"
    hadolint:
      priority: 5
      glob: Dockerfile*
      exclude:
        - .righthook/**
        - .github/workflows/righthook.yml
        - .github/dependabot.yml
        - lefthook.yml
        - .editorconfig
        - .yamllint.yaml
        - commitlint.config.mjs
      run: "sh .righthook/run.sh hadolint {staged_files}"
    markdownlint:
      priority: 5
      glob: "*.{md,mdx}"
      exclude:
        - .righthook/**
        - .github/workflows/righthook.yml
        - .github/dependabot.yml
        - lefthook.yml
        - .editorconfig
        - .yamllint.yaml
        - commitlint.config.mjs
      run: "sh .righthook/run.sh markdownlint-cli2 {staged_files}"
    shellcheck:
      priority: 5
      glob: "*.{sh,bash}"
      exclude:
        - .righthook/**
        - .github/workflows/righthook.yml
        - .github/dependabot.yml
        - lefthook.yml
        - .editorconfig
        - .yamllint.yaml
        - commitlint.config.mjs
      run: "sh .righthook/run.sh shellcheck {staged_files}"
    yamllint:
      priority: 5
      glob: "*.{yml,yaml}"
      exclude:
        - .righthook/**
