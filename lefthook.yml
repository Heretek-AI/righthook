      run: "sh .righthook/run.sh yamllint -c .yamllint.yaml {staged_files}"

pre-push:
  parallel: false
  commands:
    npm-audit:
      priority: 1
      run: "sh .righthook/run.sh npm audit --audit-level=high"
    osv-scanner:
      priority: 1
      run: "sh .righthook/run.sh osv-scanner scan source --recursive --config .righthook/osv-scanner.toml ."
    jscpd:
      priority: 2
      run: "sh .righthook/run.sh jscpd --config .righthook/jscpd.json --threshold 5 ."
    npm-test:
      priority: 2
      run: "sh .righthook/run.sh npm test"
    betterleaks-deep:
      priority: 3
      run: "sh .righthook/run.sh betterleaks git . --redact --verbose"
    tsc:
      priority: 4
      run: "sh .righthook/run.sh tsc --noEmit"
    typos:
      priority: 4
      run: "sh .righthook/run.sh typos --force-exclude ."
    actionlint:
      priority: 5
      run: "sh .righthook/run.sh actionlint"
    biome-check:
      priority: 6
      run: "sh .righthook/run.sh biome check --error-on-warnings ."
    zizmor:
      priority: 6
      run: "sh .righthook/run.sh zizmor --pedantic --min-severity=low .github/workflows"
    trivy-config:
      priority: 7
      run: "sh .righthook/run.sh trivy config --exit-code 1 --severity HIGH,CRITICAL --skip-dirs .git ."

commit-msg:
  parallel: false
  commands:
    commitlint:
      priority: 1
      run: "sh .righthook/run.sh commitlint --edit {1}"
